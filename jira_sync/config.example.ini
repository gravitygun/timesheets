# sync_worklogs.py settings. Copy to ~/.jira-sync/config.ini and chmod 600.
# Another location: pass --config PATH, or set JIRA_SYNC_CONFIG.

[jira]
# Base URL of the Jira server: no trailing /rest/..., but include any
# context path (https://tools.example/jira).
url = https://jira.example.internal

# Personal access token (Jira profile > Personal Access Tokens). First found
# wins: the JIRA_TOKEN environment variable, then token, then token_file.
# A token_file (chmod 600) keeps the secret out of this file.
token =
token_file = ~/.jira-sync/token

# Only if personal access tokens are disabled: your Jira username. The
# password is asked for each run (or read from JIRA_PASSWORD).
username =

# true, false (don't!), or the path to a PEM file for the site's internal CA,
# e.g. /etc/pki/tls/certs/ca-bundle.crt on RHEL.
verify_ssl = true

# Seconds to wait for each request.
timeout = 30

[sync]
# Bare ticket numbers from timesheets (10400) become PREFIX + number
# (MPIT-10400). IDs that are already keys (FD-2587) keep their number, with
# the project renamed by [project_map] below.
issue_prefix = MPIT-

# Jira projects never to touch, comma-separated, named as Jira knows them
# (after [project_map]), e.g. MPITFD
skip_projects =

# Timezone that decides which day a worklog belongs to. Empty means your
# Jira profile's timezone (normally right).
timezone =

# Where new worklogs start; a day's worklogs follow on from each other.
day_start = 09:00

# What logging time does to remaining estimates: auto (as the Jira UI does
# by default) or leave.
adjust_estimate = auto

# Comments are set when a worklog is created and are yours after that: edit
# them in Jira and later runs leave them alone, reconciling time only.
# true makes every run put the timesheet description back over your edits.
update_comments = false

# How apply lets you look over its changes before sending them:
#   none    just the plan and a final yes
#   step    one change at a time: send, edit the comment in $EDITOR, or skip
#   editor  all the comments in one $EDITOR file
# --step, --edit or --review MODE on the command line override this.
review = none

# Every apply and undo writes a journal here, which undo can reverse.
journal_dir = ~/.jira-sync/journals

[project_map]
# Timesheets project = Jira project, for tickets recorded with a project key
# that Jira knows by another name: FD-2587 in timesheets is MPITFD-2587 here.
FD = MPITFD

[issue_map]
# One-off exceptions, which win over everything above:
# timesheets ticket ID = Jira key, or skip.
# 10668 = MPIT-10668
# ADMIN = skip
